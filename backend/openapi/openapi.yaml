openapi: 3.1.0
info:
  title: Training Book API
  version: 0.1.0
  description: Offline-first personal training API. All /v1 endpoints require a bearer token unless marked otherwise. This is the target v1 contract; endpoints are implemented incrementally and must not be advertised as available until their integration tests pass.
x-contract-status: draft
servers:
  - url: https://api.example.invalid
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: API process is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session and offline lease issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/sync/push:
    post:
      operationId: pushOperations
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Every operation receives an independent, idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
  /v1/sync/pull:
    get:
      operationId: pullOperations
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: cursor
          schema: {type: integer, minimum: 0}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 500, default: 200}
      responses:
        '200':
          description: A stable cursor page of changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
  /v1/library/manifest:
    get:
      operationId: getLibraryManifest
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: release
          schema: {type: integer, minimum: 0}
        - in: query
          name: manifest_hash
          schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200':
          description: A pinned current target and a safe none/delta/snapshot decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryManifest'
  /v1/library/delta:
    get:
      operationId: getLibraryDelta
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: after_release
          required: true
          schema: {type: integer, minimum: 0}
        - in: query
          name: through_release
          required: true
          schema: {type: integer, minimum: 1}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Complete, release-atomic pages within the pinned range.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryDelta'}
        '409':
          description: The target or an intermediate release is unavailable; fetch a snapshot.
  /v1/library/snapshot/{release_no}:
    get:
      operationId: getLibrarySnapshot
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: release_no
          required: true
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: A complete version-pinned snapshot for the current manifest release.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibrarySnapshot'}
        '409':
          description: The release is no longer current; refresh the manifest.
  /v1/library/exercises/{exercise_id}/versions/{version_no}:
    get:
      operationId: getPublishedExerciseVersion
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: exercise_id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: version_no
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: The immutable published content referenced by a release item.
        '404':
          description: The published version is unavailable.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing, expired, revoked, or invalid credentials.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties: {status: {type: string, const: ok}}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, device_id, device_name, platform]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 12, writeOnly: true}
        device_id: {type: string, format: uuid}
        device_name: {type: string, minLength: 1, maxLength: 120}
        platform: {type: string, enum: [ios, windows]}
    SessionResponse:
      type: object
      required: [access_token, refresh_token, expires_in_seconds, offline_lease_expires_at]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        expires_in_seconds: {type: integer}
        offline_lease_expires_at: {type: string, format: date-time}
    SyncOperation:
      type: object
      additionalProperties: false
      required: [operation_id, entity_type, entity_id, operation_type, payload]
      properties:
        operation_id: {type: string, format: uuid}
        entity_type: {type: string, minLength: 1, maxLength: 80}
        entity_id: {type: string, format: uuid}
        operation_type: {type: string, enum: [create, update, delete]}
        base_revision: {type: [integer, 'null'], minimum: 1}
        payload: {type: object}
    SyncPushRequest:
      type: object
      required: [device_id, operations]
      properties:
        device_id: {type: string, format: uuid}
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/SyncOperation'}
    OperationResult:
      type: object
      required: [operation_id, result]
      properties:
        operation_id: {type: string, format: uuid}
        result: {type: string, enum: [accepted, conflict, rejected]}
        server_revision: {type: integer, minimum: 1}
        detail: {type: object}
    SyncPushResponse:
      type: object
      required: [results, next_cursor]
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/OperationResult'}
        next_cursor: {type: integer, minimum: 0}
    SyncPullResponse:
      type: object
      required: [changes, next_cursor, has_more]
      properties:
        changes:
          type: array
          items: {$ref: '#/components/schemas/SyncPullChange'}
        next_cursor: {type: integer, minimum: 0}
        has_more: {type: boolean}
    SyncPullChange:
      type: object
      required:
        [server_cursor, operation_id, device_id, entity_type, entity_id,
         operation_type, payload, result, created_at]
      properties:
        server_cursor: {type: integer, minimum: 1}
        operation_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        entity_type: {type: string}
        entity_id: {type: string, format: uuid}
        operation_type: {type: string, enum: [create, update, delete]}
        base_revision: {type: [integer, 'null'], minimum: 1}
        payload: {type: object}
        result: {type: string, enum: [accepted, conflict, rejected]}
        server_revision: {type: [integer, 'null'], minimum: 1}
        detail: {type: object}
        created_at: {type: string, format: date-time}
    LibraryManifest:
      type: object
      required: [release_no, manifest_hash, min_client_schema, change]
      properties:
        release_no: {type: integer, minimum: 0}
        manifest_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        min_client_schema: {type: integer, minimum: 1}
        change: {type: string, enum: [none, delta, snapshot]}
        delta_after_release: {type: [integer, 'null'], minimum: 0}
        delta_through_release: {type: [integer, 'null'], minimum: 0}
        snapshot_release: {type: [integer, 'null'], minimum: 0}
        download_url: {type: [string, 'null'], format: uri}
    LibraryReleaseItem:
      type: object
      required: [exercise_id, version_no, name_zh, recording_mode, content_hash]
      properties:
        exercise_id: {type: string, format: uuid}
        version_no: {type: integer, minimum: 1}
        name_zh: {type: string}
        recording_mode: {type: string}
        content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
    LibraryReleaseDelta:
      type: object
      required: [release_no, manifest_hash, min_client_schema, items]
      properties:
        release_no: {type: integer, minimum: 1}
        manifest_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        min_client_schema: {type: integer, minimum: 1}
        items:
          type: array
          items: {$ref: '#/components/schemas/LibraryReleaseItem'}
    LibraryDelta:
      type: object
      required: [after_release, through_release, next_after_release, manifest_hash, min_client_schema, releases, has_more]
      properties:
        after_release: {type: integer, minimum: 0}
        through_release: {type: integer, minimum: 0}
        next_after_release: {type: integer, minimum: 0}
        manifest_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        min_client_schema: {type: integer, minimum: 1}
        releases:
          type: array
          items: {$ref: '#/components/schemas/LibraryReleaseDelta'}
        has_more: {type: boolean}
    LibrarySnapshot:
      type: object
      required: [release_no, manifest_hash, min_client_schema, items]
      properties:
        release_no: {type: integer, minimum: 0}
        manifest_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        min_client_schema: {type: integer, minimum: 1}
        items:
          type: array
          items: {$ref: '#/components/schemas/LibraryReleaseItem'}
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
